<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>analystics Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca&display=swap" rel="stylesheet">
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      background-color: hsl(233, 47%, 7%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: hsl(0, 0%, 100%);
      line-height: 1.6;
    }
    .card{
      background-color: hsl(244, 38%, 16%);
      border-radius: 8px;
      overflow: hidden;
      max-width: 1110px;
      display: flex;
      flex-direction: column;
    }
    .card-image{
      background-color: hsl(277, 64%, 61%);
      height: 450px;
      position: relative;
    }
    .card-image img{
      width: 100%;
      height: 100%;
      object-position:top center bottom;
      object-fit: cover;
      mix-blend-mode: multiply;
      opacity: 0.8;
      display: block;
    }
    .card-content{
      padding: 40px 32px 32px;
      text-align: center;
    }
    .card-title{
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .card-title span{
      color: hsl(277, 64%, 61%);
    }
    .crad-disciption{
      color: hsla(0, 0%, 100%, 0.75);
      margin-bottom: 40px;
    }
    .items{
      display: flex;
      flex-direction: column;
      gap: 24px;

    }
    .stat-item{
      text-transform: uppercase;
    }
    .item-number{
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;

    }
    .item-label{
      font-family: 'lexend', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: hsla(0, 0%, 100%, 0.6);
    }
    @media (mni-width: 1440px){
      .card{
        flex-direction: row;
        height: 446px;
      }
      .card-content{
        width: 51.5%;
        padding: 72px;
        text-align: left;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .crad-disciption{
        max-width: 350px;
        margin-bottom: 0;
      }
      .card-title{
        font-size: 36px;
      }
      .item{
       flex-direction: row;
       justify-content: space-between;
       max-width: 370px;
       margin-top: auto;
      }
      .card-image{
        width: 48.5px;
        height: auto;
        order: 1;
      }
    }
   @media (max-width: 375px){
    .card-content{
      font-size: 24px;
    }
   }


    
  </style>
</head>
<body>
  <div class="card">
    <div class="card-image">
      <img src="image-header-desktop.jpg" alt="Data analytics group">
    </div>
    <div class="card-content">
      <h1 class="card-title">Get <span>insights</span> that help your business grow. </h1>
      <p class="card-discription">Discover the benefits of data analystics 
        and make better desicions regarding revenue, customer experience, and overall efficiency.
      
      </p>
      <div class="items">
        <div class="stat-item">
          <div class="item-number">10K+</div>
          <div class="item-label">companies</div>
        </div>
          <div class="stat-item">
            <div class="item-number">314</div>
            <div class="item-label">template</div>
          </div>
            <div class="stat-item">
              <div class="item-number">12M+</div>
              <div class="item-label">queries</div>
      </div>
    </div>
  </div>
</body>
</html>
